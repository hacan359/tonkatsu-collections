name: Validate

on:
  pull_request:
    paths:
      - '**.xcoll'
      - '**.xcollx'
      - '**.zip'
      - '**/_platform.json'
      - '**/_media.json'

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate collection files
        run: python scripts/validate_xcoll.py
